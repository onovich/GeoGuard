实分裂体 · SHARD 死亡","counts":{"enemies":3,"towers":0,"hazards":0,"projectiles":0},"mode":"debug","money":1000001,"hash":"b5a3831c1836b59d0189052cff9e5aad873bbabc0af6c023ec0be5dee1618473"}],sel=document.getElementById('scene'),shot=document.getElementById('shot');let z=100;function show(){const s=data[+sel.value],url='comparison-final/'+s.name+'-'+z+'.png';shot.src=url;document.getElementById('full').href=url;document.getElementById('note').textContent=s.label+' | '+s.counts.enemies+' 敌人 / '+s.counts.towers+' 塔 / '+s.counts.hazards+' 危险区 | 同一 semantic SHA：'+s.hash;document.getElementById('one').setAttribute('aria-pressed',z===100);document.getElementById('zoom').setAttribute('aria-pressed',z===125);}sel.onchange=show;document.getElementById('one').onclick=()=>{z=100;show()};document.getElementById('zoom').onclick=()=>{z=125;show()};document.getElementById('native').onclick=()=>document.body.classList.toggle('native');show();</script></html>
