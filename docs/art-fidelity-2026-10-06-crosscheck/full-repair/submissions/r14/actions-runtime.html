<!doctype html><meta charset="utf-8"><style>body{background:#fff9ef;color:#4b281c;font:14px sans-serif}main{display:grid;grid-template-columns:repeat(2,480px);gap:12px}canvas{display:block}b{display:block;min-height:45px}pre{white-space:pre-wrap;overflow-wrap:anywhere}button{padding:8px}</style><h1>48原像素连续动作采样 · 明确模块QA</h1><p>实际drawCharacter/getCharacterAnchors/原PNG，电脑相机1.25。动作时间连续，逻辑位置固定；Boss真实技能时间另由95实AI入口证明，此页只验证关键帧连续读感/root与器官，不把手动阶段适配冒称Boss AI。每页8身份，控制步进与播放。七分层塔明确sourceAimExact=true；SNIPER/RAIL方向整帧尚未自由瞄准，不混成同一路径。使用首帧固定referenceRoot作展示原点，记录逐帧rootDrift，绝不每帧重新归中隐藏漂移。</p><button id="prev">上页</button><button id="next">下页</button><button id="play">播放/暂停</button><button id="step">前进1/60秒</button><button id="contact">一次生成本页连续时刻联系页</button><details><summary>展开连续帧真实收据（源/根点/边界）</summary><pre id="status">真实模块加载…</pre></details><main></main><div id="contacts"></div><script type="module">
import*as cm from'/src/view/art/characters/index.js';import*as wm from'/src/view/art/world/index.js';import{ORIGINAL_DISPLAY_SCALE}from'/src/view/art/characters/originalPixels.js';import{TOWER_LIBRARY,ENEMY_TYPES,BOSS_TYPES,BOSS_ORDER}from'/src/data/gameConfig.js';import{createBossEncounterRuntime}from'/src/logic/engine/encounterRuntime.js';import{createRuntimeState}from'/src/logic/engine/gameState.js';
const ca=await cm.loadCharacterArt({baseUrl:'/'}),wa=await wm.loadWorldArt({baseUrl:'/'}),radii={'hero:PLAYER':createRuntimeState().player.radius};for(const t of Object.values(TOWER_LIBRARY))radii['tower:'+t.id]=t.radius;for(const[e,t]of Object.entries(ENEMY_TYPES))radii['enemy:'+e]=t.radius;let next=1;for(const id of BOSS_ORDER)for(const b of createBossEncounterRuntime({bossTemplate:BOSS_TYPES[id],x:0,y:0,allocateEnemyUid:()=>next++,allocateEncounterUid:()=>next++})){radii[cm.resolveCharacterArtId({domain:'boss',id:b.id,twinRole:b.twinRole})]=b.radius}for(const kind of['NEST','WEB','ROOT','WALL','SEAL','RETICLE','COURIER'])radii['mechanic:'+kind]=kind==='WALL'?18:13;

const entries=Object.entries(radii);let page=0,time=0,playing=true,last=performance.now();const records=[],cells=[];function mount(){cells.length=0;document.querySelector('main').replaceChildren();for(const[artId,radius]of entries.slice(page*8,page*8+8)){const article=document.createElement('article'),label=document.createElement('b'),canvas=document.createElement('canvas');canvas.width=470;canvas.height=470;article.append(label,canvas);document.querySelector('main').append(article);cells.push({artId,radius,label,canvas});}time=0;records.length=0;}document.querySelector('#prev').onclick=()=>{page=(page+5)%6;mount()};document.querySelector('#next').onclick=()=>{page=(page+1)%6;mount()};document.querySelector('#play').onclick=()=>playing=!playing;document.querySelector('#step').onclick=()=>{playing=false;time+=1/60;paint()};
function paint(){const phase=time%4,dir=Math.floor(time/4)%4,facing=['right','down','left','up'][dir],aimAngle=[0,Math.PI/2,Math.PI,-Math.PI/2][dir];const tick=[];for(const c of cells){const mechanic=c.artId.startsWith('mechanic:'),boss=c.artId.startsWith('boss:');const pose=mechanic?['intact','trigger','broken','fade'][Math.floor(phase)]:boss?['neutral','windup','attack','open'][Math.floor(phase)]:phase<1?'move':phase<1.5?'squash':phase<2?'stretch':phase<2.5?'attack':'neutral';const actor={artId:c.artId,radius:c.radius,x:0,y:0,hp:100,alpha:1,pose,facing,aimAngle,poseTime:phase,poseProgress:phase%1,sourceAimExact:c.artId.startsWith('tower:'),states:{}};const frame={time,quality:'full'},anchors=cm.getCharacterAnchors(actor,frame),ctx=c.canvas.getContext('2d'),receipts=[];ctx.clearRect(0,0,470,470);ctx.save();ctx.translate(235,400);ctx.scale(1.25,1.25);c.referenceRoot??={...anchors.root};ctx.translate(-c.referenceRoot.x,-c.referenceRoot.y);wm.drawActorOverlay(ctx,actor,anchors,frame,wa.assets,'shadow');const result=cm.drawCharacter(ctx,actor,frame,{...ca.assets,onSourceDraw:r=>receipts.push(r)});ctx.strokeStyle='#2683d3';ctx.lineWidth=.8;ctx.beginPath();ctx.moveTo(anchors.root.x-4,anchors.root.y);ctx.lineTo(anchors.root.x+4,anchors.root.y);ctx.moveTo(anchors.root.x,anchors.root.y-4);ctx.lineTo(anchors.root.x,anchors.root.y+4);ctx.stroke();ctx.restore();const row={artId:c.artId,time,pose,facing,poseTime:phase,root:anchors.root,referenceRoot:c.referenceRoot,rootDrift:{x:anchors.root.x-c.referenceRoot.x,y:anchors.root.y-c.referenceRoot.y},sourceAimExact:actor.sourceAimExact,bounds:anchors.bounds,muzzles:anchors.muzzles,drawn:result.drawn,sourceKeys:receipts.map(r=>r.key),resources:receipts.map(r=>r.resource)};tick.push(row);c.label.textContent=c.artId+' · '+pose+' / '+facing+' · '+row.sourceKeys.join(',');}records.push(tick);if(records.length>960)records.shift();document.querySelector('#status').textContent=JSON.stringify({page:page+1,time,playing,errors:[...ca.errors,...wa.errors],current:tick,sampledFrames:records.length},null,2);window.__artActionSamples=records;}document.querySelector('#contact').onclick=()=>{playing=false;const output=document.querySelector('#contacts');output.replaceChildren();const groups=cells.map(c=>{const section=document.createElement('section'),label=document.createElement('h2'),grid=document.createElement('div');label.textContent=c.artId;grid.style.cssText='display:grid;grid-template-columns:repeat(5,235px);gap:4px';section.append(label,grid);output.append(section);return grid});const contactRecords=[];for(const t of [0,.12,.36,.6,1,1.5,2,2.3,2.5,3]){time=t;paint();const receipt=records.at(-1);contactRecords.push(receipt);cells.forEach((c,i)=>{const box=document.createElement('div'),label=document.createElement('b'),img=document.createElement('img');label.textContent=t.toFixed(2)+'s '+receipt[i].pose+' rootΔ '+receipt[i].rootDrift.x.toFixed(3)+','+receipt[i].rootDrift.y.toFixed(3);img.src=c.canvas.toDataURL('image/png');img.width=235;img.height=235;box.append(label,img);groups[i].append(box)})}const pre=document.createElement('pre');pre.textContent=JSON.stringify({scope:'actual source renderer at sequential declared QA clip times; not actual Boss AI',page:page+1,samples:contactRecords},null,2);const details=document.createElement('details');details.innerHTML='<summary>连续时刻完整源/根点收据</summary>';details.append(pre);output.append(details);};function loop(now){if(playing)time+=Math.min(.05,(now-last)/1000);last=now;paint();requestAnimationFrame(loop)}mount();requestAnimationFrame(loop);
</script>
