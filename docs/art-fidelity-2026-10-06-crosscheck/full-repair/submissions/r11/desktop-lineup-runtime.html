<!doctype html><meta charset="utf-8"><style>body{background:#fff9ef;color:#4b281c;font:14px sans-serif}button{padding:8px;margin:4px}canvas{display:block;max-width:100%}#status{overflow-wrap:anywhere}</style><h1>实际全场调用链 · 电脑尺度与HP</h1><p>真实drawStickerScene+drawCharacter+drawActorOverlay+sourceNineSlice。保持电脑镜头1.25，collision/range/AI数值不变。前三排我方、敌人、Boss；按钮验证血量0/11/50/100及level1/4/5/8。此为生产模块场景装配样本，不替代真实战斗或最终密度性能。</p><nav id="controls"></nav><p id="status"></p><canvas width="1280" height="720"></canvas><script type="module">
import*as cm from'/src/view/art/characters/index.js';import*as wm from'/src/view/art/world/index.js';import{drawStickerScene}from'/src/view/art/integration/stickerScene.js';import{TOWER_LIBRARY,ENEMY_TYPES,BOSS_TYPES}from'/src/data/gameConfig.js';
const ca=await cm.loadCharacterArt({baseUrl:'/'}),wa=await wm.loadWorldArt({baseUrl:'/'}),registry={status:'ready',characters:{status:ca.status,module:cm,assets:ca.assets},world:{status:wa.status,module:wm,assets:wa.assets},drawErrors:[],fallbackArtIds:new Set()},canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');let health=11;
function draw(){const actors=[];const add=(artId,radius,x,y,domain,level=0)=>actors.push({entity:{},actor:{artId,radius,x,y,domain,key:artId+actors.length,pose:'neutral',facing:'right',aimAngle:0,alpha:1,hp:health,maxHp:100,level,states:{}}});add('hero:PLAYER',12,-445,-220,'hero');let i=0;for(const t of Object.values(TOWER_LIBRARY))add('tower:'+t.id,t.radius,-345+i++*88,-220,'tower',[1,4,5,8][i%4]);i=0;for(const[e,t]of Object.entries(ENEMY_TYPES))if(cm.resolveCharacterArtId({domain:'enemy',id:e})){add('enemy:'+e,t.radius,-445+(i%12)*80,-90+Math.floor(i/12)*90,'enemy');i++}i=0;for(const id of ['COMMANDER','FORTRESS','DRAGON','SPIDER_MATRIARCH','PRISM','HUNTER']){const t=Object.values(BOSS_TYPES).find(t=>t.id.replace(/_T[123]$/,'')===id);add('boss:'+id,t?.radius??40,-400+i++*160,170,'boss')}
const state={camera:{x:0,y:0,shakeTimer:0},gameTime:0,dragPlacement:{active:false},floatingTexts:[],joystick:{active:false}},runtime={prepare:(state,viewport,camera)=>({frame:{viewport,camera,time:0,quality:'full'},actors,retired:[],hazards:[],items:[],links:[]})};ctx.clearRect(0,0,canvas.width,canvas.height);drawStickerScene(ctx,canvas,{state,art:{registry,runtime},getTowerById:()=>null,paused:true});document.querySelector('#status').textContent=JSON.stringify({ca:ca.status,wa:wa.status,health,actors:actors.length,errors:registry.drawErrors,decodeErrors:[...ca.errors,...wa.errors]})}
for(const hp of[0,11,50,100]){const b=document.createElement('button');b.textContent='HP '+hp;b.onclick=()=>{health=hp;draw()};document.querySelector('#controls').append(b)}draw();
</script>
