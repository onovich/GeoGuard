<!doctype html><meta charset="utf-8"><title>实际状态与反馈原像素模块</title><style>body{background:#fff9ef;color:#4b281c;font:14px sans-serif}main{display:grid;grid-template-columns:repeat(4,240px);gap:12px}b{display:block;min-height:40px}canvas{background:#fff9ef}#status{overflow-wrap:anywhere}</style><h1>状态 / 资格 / placement / 反馈</h1><p>实际生产模块；1.25电脑倍率及3倍各一图。仅模块静态样本，不代替真实95技能或动态验收。</p><p id="status"></p><main id="grid"></main><script type="module">
import{loadWorldArt,drawActorOverlay,drawPlacement,drawWorldItem,drawHazard}from'/src/view/art/world/index.js';
import{loadCharacterArt,drawCharacter,getCharacterAnchors}from'/src/view/art/characters/index.js';
const world=await loadWorldArt({baseUrl:'/'}),characters=await loadCharacterArt({baseUrl:'/'});document.querySelector('#status').textContent=JSON.stringify({world:world.status,characters:characters.status,errors:world.errors,images:Object.keys(world.assets?.originalEffects??{}).length});
const cases=['shield','slowed','frozen','armored','open','partnerFallen','phased','burrowed','intro','jammed','heal','fuse','placement-valid','placement-invalid','drop','particle-chip','particle-leaf','impact-onset','impact-peak','impact-fade','twinFinisher','dragonFinisher','spiderFinisher','astrolabeFinisher','hit','defeat','refund','summon-success','split-success','root-link','target-link','hazard-web','hazard-root','hazard-pulse'];
for(const name of cases){const article=document.createElement('article'),b=document.createElement('b');b.textContent=name;article.append(b);for(const zoom of[1.25,3]){const canvas=document.createElement('canvas');canvas.width=240;canvas.height=240;article.append(canvas);const ctx=canvas.getContext('2d');ctx.translate(120,130);ctx.scale(zoom,zoom);const actor={artId:'enemy:BASIC',x:0,y:0,radius:12,hp:100,alpha:1,pose:'neutral',facing:'right',states:{}};if(name==='shield'){actor.shield=100;actor.maxShield=100}else if(name==='intro')actor.pose='intro';else actor.states[name]=true;if(name==='heal')actor.healAura={active:true,range:30,eligibleTargetKeys:['actual-eligible-sample']};if(name==='fuse')actor.fuse={active:true,remaining:.5,duration:1};const anchors=getCharacterAnchors(actor,{time:0});if(cases.indexOf(name)<12){drawActorOverlay(ctx,actor,anchors,{time:0},world.assets,'shadow');drawCharacter(ctx,actor,{time:0},characters.assets);drawActorOverlay(ctx,actor,anchors,{time:0},world.assets,'status')}else if(name.startsWith('placement')){drawPlacement(ctx,{x:0,y:0,range:27,radius:12,canPlace:name==='placement-valid'},{time:0},world.assets)}else if(name.startsWith('hazard-')){const h={x:0,y:0,type:'area',radius:27,timer:.5,maxTimer:1,terrain:name!=='hazard-pulse',label:name==='hazard-web'?'web':'poison',mechanicKind:name==='hazard-root'?'root':null,pulsesRemaining:name==='hazard-pulse'?3:1};drawHazard(ctx,h,{time:0},world.assets,'fill');drawHazard(ctx,h,{time:0},world.assets,'boundary')}else if(name==='drop')drawWorldItem(ctx,{kind:'drop',x:0,y:0,radius:7,alpha:1},{},world.assets);else if(name.startsWith('particle'))drawWorldItem(ctx,{kind:'particle',key:'stable-key',style:name==='particle-leaf'?'leaf':'chip',x:0,y:0,radius:4,alpha:1},{},world.assets);else if(name.startsWith('impact')||name.endsWith('Finisher')){const t=name==='impact-onset'?.1:name==='impact-fade'?.85:.5;drawWorldItem(ctx,{kind:'impactWave',style:name,x:0,y:0,radius:25,life:1-t,maxLife:1,alpha:1},{},world.assets)}else if(name.endsWith('-link'))drawWorldItem(ctx,{kind:'link',style:name.startsWith('root')?'root':'target',x:-20,y:0,x2:20,y2:0,alpha:1},{},world.assets);else drawWorldItem(ctx,{kind:'feedback',x:0,y:0,alpha:1,data:{type:name,time:0,projectileKind:'basic',childKeys:['actual-generated-child-sample'],amount:12}},{time:.08,quality:'full'},world.assets)}document.querySelector('#grid').append(article)}
</script>
