<!doctype html><meta charset="utf-8"><style>body{background:#fff9ef;font:14px sans-serif;color:#4b281c}button{margin:4px;padding:6px}.stage{position:relative;width:1280px;height:270px;max-width:100%;border-bottom:1px solid #ddd}</style><h1>实际GameHud：玩家与单/双Boss HP皮肤</h1><p>生产React组件，填充内缩且原图frame独立覆盖层；0/11/50/100%切换。无需改核心规则，样本状态明示。首次教学条为组件真实默认，可点击“我知道了”隐藏以检查HP。独立QA，不冒充真实整游戏DPR2。</p><nav id="controls"></nav><main></main><script type="module">
import '/src/styles/index.css';import React from'react';import{createRoot}from'react-dom/client';import GameHud from'/src/view/components/GameHud.jsx';
const roots=[];for(const label of['玩家','单Boss','双Boss']){const h=document.createElement('h2');h.textContent=label;document.querySelector('main').append(h);const d=document.createElement('div');d.className='stage';document.querySelector('main').append(d);roots.push(createRoot(d))}
function render(hp){roots.forEach((root,i)=>{const members=Array.from({length:i===2?2:1},(_,j)=>({id:'boss'+j,artId:j?'boss:TWINS_MOON':'boss:TWINS_SUN',name:j?'月蚀':'日耀',hpRatio:hp/100,phase:'常态',phaseCount:3,phaseIndex:0,actionLabel:'实际状态样本',guardCount:0}));root.render(React.createElement(GameHud,{gameState:'PLAYING',paused:false,togglePause:()=>{},health:hp,maxHealth:100,money:18,formattedTime:'18:42',currentWave:31,debugMode:false,bossHud:i?[{id:'group',title:i===2?'双子':'日耀',members,counterplay:'保持移动，观察真实预警。'}]:[]}))})}
for(const hp of[0,11,50,100]){const b=document.createElement('button');b.textContent='HP '+hp;b.onclick=()=>render(hp);document.querySelector('#controls').append(b)}render(100);
</script>
