<!doctype html><meta charset="utf-8"><style>body{background:#fff9ef;color:#4b281c;font:14px sans-serif}main{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}canvas{display:block;max-width:100%;height:auto}b{display:block}</style><h1>紧凑真实入场环 · 四身份四方向</h1><p>实际生产模块，固定源外环；原内两圈分离不用于身体入场。容纳真实alpha bounds，四方向不更改逻辑root。每格1.25/3倍率；QA画布按同身份最大外环留白，不裁轮廓。</p><p id="status"></p><main></main><script type="module">
import{loadWorldArt,drawActorOverlay}from'/src/view/art/world/index.js';import{loadCharacterArt,drawCharacter,getCharacterAnchors}from'/src/view/art/characters/index.js';
const w=await loadWorldArt({baseUrl:'/'}),c=await loadCharacterArt({baseUrl:'/'});document.querySelector('#status').textContent=w.status+'/'+c.status;
for(const[id,r]of[['enemy:BASIC',12],['boss:FORTRESS',42],['boss:DRAGON',42],['boss:SPIDER_MATRIARCH',42]])for(const facing of['right','left','up','down']){const actor={artId:id,x:0,y:0,radius:r,hp:100,pose:'intro',facing,aimAngle:{right:0,left:Math.PI,up:-Math.PI/2,down:Math.PI/2}[facing],alpha:1,states:{}},frame={time:0},anchors=getCharacterAnchors(actor,frame),b=anchors.bounds;const article=document.createElement('article'),label=document.createElement('b');label.textContent=id+'/'+facing;article.append(label);for(const zoom of[1.25,3]){const canvas=document.createElement('canvas');canvas.width=Math.ceil((Math.max(b.width,b.height)+4)/.6*zoom+80);canvas.height=canvas.width;article.append(canvas);const ctx=canvas.getContext('2d');ctx.translate(canvas.width/2,canvas.height/2);ctx.scale(zoom,zoom);ctx.translate(-b.x-b.width/2,-b.y-b.height/2);drawCharacter(ctx,actor,frame,c.assets);drawActorOverlay(ctx,actor,anchors,frame,w.assets,'status')}document.querySelector('main').append(article)}
</script>
