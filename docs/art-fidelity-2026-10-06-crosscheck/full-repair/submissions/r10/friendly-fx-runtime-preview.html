<!doctype html><meta charset="utf-8"><title>Real original shot modules</title><style>body{background:#fff9ef;color:#4b281c;font:14px sans-serif}main{display:grid;grid-template-columns:repeat(4,220px);gap:12px}article{min-height:160px}b{display:block;min-height:30px}canvas{background:#fff9ef}#status{overflow-wrap:anywhere}</style><h1>十源独立弹体与枪口 flash 实际模块</h1><p>实际 loadWorldArt/drawWorldItem；四朝向，1.25电脑倍率与3倍同时预览。M 为 flash 左侧发射根，弹体为独立 item；不声称真实逻辑出生通过。</p><p id="status"></p><main id="grid"></main><script type="module">
import{loadWorldArt,drawWorldItem}from'/src/view/art/world/index.js';
import{shotStyles}from'/src/view/art/world/manifest.js';
const loaded=await loadWorldArt({baseUrl:'/'});document.getElementById('status').textContent=JSON.stringify({status:loaded.status,errors:loaded.errors,decodedEffects:Object.keys(loaded.assets?.originalEffects??{}).length});
for(const[id,s]of Object.entries(shotStyles))for(const[name,angle]of[['right',0],['left',Math.PI],['up',-Math.PI/2],['down',Math.PI/2]]){const article=document.createElement('article'),label=document.createElement('b');label.textContent=id+'/'+name;article.append(label);for(const zoom of[1.25,3]){const c=document.createElement('canvas');c.width=220;c.height=240;article.append(c);const ctx=c.getContext('2d');ctx.translate(110,120);ctx.scale(zoom,zoom);const r=s.kind==='cannon'?7:s.kind==='sniper'?3:4;drawWorldItem(ctx,{kind:'projectile',sourceArtId:id,x:Math.cos(angle)*18,y:Math.sin(angle)*18,radius:r,alpha:1,data:{kind:s.kind,vx:Math.cos(angle),vy:Math.sin(angle)}},{time:0,quality:'full'},loaded.assets);drawWorldItem(ctx,{kind:'feedback',sourceArtId:id,x:-Math.cos(angle)*15,y:-Math.sin(angle)*15,alpha:1,data:{type:'shot',time:0,projectileKind:s.kind,angle,muzzle:{x:-Math.cos(angle)*15,y:-Math.sin(angle)*15,axisAngle:angle}}},{time:.025,quality:'full'},loaded.assets)}document.getElementById('grid').append(article)}
</script>
