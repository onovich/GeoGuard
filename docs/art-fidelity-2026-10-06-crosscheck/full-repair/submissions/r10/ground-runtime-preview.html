<!doctype html><meta charset="utf-8"><title>BG02 actual source runtime</title><style>body{background:#fff9ef;font:16px sans-serif;color:#4b281c}canvas{display:block;margin-top:12px}button{margin-right:8px;padding:8px}p{max-width:1000px}</style><h1>BG02 实际源像素世界 · 五窗口</h1><p>真实 loadWorldArt/drawWorldBackground/drawCharacter，源地斑、草簇和奶油底片；蓝字是 QA 注释，非玩家美术。按钮覆盖原点、正/负坐标及分区边界。角色尺寸仍当前基线，未宣称最终比例通过。</p><nav id="controls"></nav><span id="status"></span><canvas id="view" width="960" height="540"></canvas><script type="module">
import{loadWorldArt,drawWorldBackground,drawActorOverlay}from'/src/view/art/world/index.js';
import{loadCharacterArt,drawCharacter,getCharacterAnchors}from'/src/view/art/characters/index.js';
const world=await loadWorldArt({baseUrl:'/'}),characters=await loadCharacterArt({baseUrl:'/'}),canvas=document.getElementById('view'),ctx=canvas.getContext('2d');
function draw(x,y){const frame={viewport:{width:960,height:540},camera:{x,y},quality:'full',time:0};ctx.clearRect(0,0,960,540);ctx.save();ctx.translate(480-x,270-y);drawWorldBackground(ctx,frame,world.assets);for(const[id,dx,dy,r]of[['hero:PLAYER',0,0,14],['tower:BASIC',-100,80,14],['tower:RAIL',80,80,14],['enemy:BASIC',180,-50,12],['enemy:TANK',-180,-50,18]]){const actor={artId:id,x:x+dx,y:y+dy,radius:r,pose:'neutral',facing:'right',aimAngle:0,alpha:1};drawActorOverlay(ctx,actor,getCharacterAnchors(actor,frame),frame,world.assets,'shadow');drawCharacter(ctx,actor,frame,characters.assets)};ctx.restore();document.getElementById('status').textContent=`camera (${x},${y}); world ${world.status}; decode errors ${world.errors.length+characters.errors.length}`;}
for(const[label,x,y]of[['原点',0,0],['正坐标',1000,500],['负坐标',-1000,-500],['负分区边',-360,-225],['正分区边',359,224]]){const b=document.createElement('button');b.textContent=label;b.onclick=()=>draw(x,y);document.getElementById('controls').append(b)}draw(0,0);
</script>
