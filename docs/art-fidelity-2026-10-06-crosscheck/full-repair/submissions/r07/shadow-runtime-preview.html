<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>真实原像素模块验收</title>
<style>*{box-sizing:border-box}body{margin:20px;background:#fff9ef;color:#4b281c;font:14px/20px sans-serif}main{display:grid;grid-template-columns:repeat(4,220px);gap:12px}article{border:1px solid #ccc;padding:4px}article>b{display:block;min-height:60px}canvas{display:block}p{max-width:900px}button,select{padding:8px;margin-bottom:12px}#status{display:block;overflow-wrap:anywhere;max-width:960px}</style>
<h1>原图接地影 · 生产角色及world overlay模块</h1><p>只调用真实loadCharacterArt/drawCharacter/getCharacterAnchors；上画布1.25相机基线，下画布放大。脚root蓝十字、源alpha bounds紫框、美术M红点只属验收层；不证明逻辑弹体出生或技能实机。派生pose会显示实际采样source key；角色动画本身不施加逻辑位移。</p><select id="identity"></select><button id="freeze">冻结动画</button><span id="status">载入…</span><main id="grid"></main>
<script type="module">
import {loadCharacterArt,drawCharacter,getCharacterAnchors,characterManifest,usesOriginalPixels} from '/src/view/art/characters/index.js';
import {loadWorldArt,drawActorOverlay} from '/src/view/art/world/index.js';
const {assets:worldAssets,errors:worldErrors}=await loadWorldArt({baseUrl:'/'});
import {originalFrameData} from '/src/view/art/characters/originalFrameData.js';
import {selectOriginalFrame} from '/src/view/art/characters/originalPixels.js';
const params=new URLSearchParams(location.search),artId=params.get('art')??'tower:BURST',entry=characterManifest[artId];
const chooser=document.getElementById('identity');for(const id of Object.keys(characterManifest).filter(usesOriginalPixels)){const option=document.createElement('option');option.value=id;option.textContent=id;option.selected=id===artId;chooser.append(option)}chooser.onchange=()=>location.search='?art='+encodeURIComponent(chooser.value);
const {assets,errors}=await loadCharacterArt({baseUrl:'/'});document.getElementById('status').textContent=`实际PNG身份${Object.keys(assets.originalBodies).length}；解码错误${errors.length}；当前 ${artId}；${Object.keys(assets.originalBodies).join(', ')}`;
let frozen=false,time=0,last=performance.now();document.getElementById('freeze').onclick=()=>frozen=!frozen;const cells=[];
for(const pose of ['neutral','squash','stretch','attack','move','windup','trigger','recover'])for(const [facing,aimAngle]of[['right',0],['left',Math.PI],['up',-Math.PI/2],['down',Math.PI/2]]){const article=document.createElement('article'),label=document.createElement('b');article.append(label);const canvases=[];for(const zoom of[1.25,3]){const canvas=document.createElement('canvas');canvas.width=210;canvas.height=185;article.append(canvas);canvases.push({canvas,zoom})}document.getElementById('grid').append(article);cells.push({pose,facing,aimAngle,label,canvases})}
function tick(now){if(!frozen)time+=(now-last)/1000;last=now;for(const cell of cells){const actor={artId,x:0,y:0,radius:entry.referenceRuntimeRadius,pose:cell.pose,facing:cell.facing,aimAngle:cell.aimAngle,poseTime:time,poseProgress:(time%1.2)/1.2,alpha:1,hitFlash:0},frame={time,quality:'full'},anchors=getCharacterAnchors(actor,frame);cell.label.textContent=`${cell.pose} / ${cell.facing} · ${originalFrameData[artId]?selectOriginalFrame(actor,originalFrameData[artId]):'原图分层变换'}`;for(const{canvas,zoom}of cell.canvases){const ctx=canvas.getContext('2d');ctx.clearRect(0,0,canvas.width,canvas.height);const box=anchors?.bounds,fit=zoom===3&&box?Math.min(3,190/box.width,155/box.height):zoom;ctx.save();ctx.translate(105,100);ctx.scale(fit,fit);drawActorOverlay(ctx,actor,anchors,frame,worldAssets,'shadow');const result=drawCharacter(ctx,actor,frame,assets);if(anchors){ctx.lineWidth=1/fit;if(box){ctx.strokeStyle='#9b63ba';ctx.strokeRect(box.x,box.y,box.width,box.height)}ctx.strokeStyle='#2683d3';ctx.beginPath();ctx.moveTo(anchors.root.x-4,anchors.root.y);ctx.lineTo(anchors.root.x+4,anchors.root.y);ctx.moveTo(anchors.root.x,anchors.root.y-4);ctx.lineTo(anchors.root.x,anchors.root.y+4);ctx.stroke();for(const m of anchors.muzzles??[]){ctx.fillStyle='#d32e35';ctx.beginPath();ctx.arc(m.x,m.y,1.5/fit,0,Math.PI*2);ctx.fill()}}ctx.restore();if(!result.drawn)ctx.fillText(result.reason,8,25)}}requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script></html>
