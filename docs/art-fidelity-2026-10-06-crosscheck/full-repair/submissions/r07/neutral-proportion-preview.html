<!doctype html><meta charset="utf-8"><title>Original neutral proportion</title><style>body{background:#fff9ef;color:#4b281c;font:16px sans-serif}main{display:grid;grid-template-columns:420px 420px;gap:16px}canvas{background:#fff9ef}h2{font-size:20px}</style><h1>原neutral与实际分层 · 身体高度归一200px</h1><p>左：批准去guide原neutral参考；右：真实生产渲染，身体高200px（不按整体bbox缩小炮管）。只供比例验收；脚root与逻辑未变。原板和补层身材区别需逐项评价。</p><main id="grid"></main><script type="module">
import{loadCharacterArt,drawCharacter,getCharacterAnchors,characterManifest}from'/src/view/art/characters/index.js';
import{originalLayerData}from'/src/view/art/characters/originalLayerData.js';
import{originalFrameData}from'/src/view/art/characters/originalFrameData.js';
const{assets}=await loadCharacterArt({baseUrl:'/'});
for(const name of['CANNON','SNIPER']){const id='tower:'+name;const image=new Image();image.src='/art/original/v1/characters/'+name.toLowerCase()+'/neutral-reference.png';await image.decode();const off=document.createElement('canvas');off.width=image.width;off.height=image.height;const oc=off.getContext('2d');oc.drawImage(image,0,0);const rgba=oc.getImageData(0,0,image.width,image.height).data;let bottom=0,top=image.height;for(let y=0;y<image.height;y++)for(let x=0;x<image.width;x++)if(rgba[(y*image.width+x)*4+3]>64){bottom=Math.max(bottom,y);top=Math.min(top,y)}const scan=bottom-5,runs=[];let start=null;for(let x=0;x<=image.width;x++){const on=x<image.width&&rgba[(scan*image.width+x)*4+3]>64;if(on&&start===null)start=x;if(!on&&start!==null){if(x-start>=3)runs.push([start,x]);start=null}}const sourceRoot=runs.reduce((v,[a,b])=>v+(a+b)/2,0)/runs.length;const sourceBodyHeight=bottom-top-24;
for(const mode of['source','runtime']){const a=document.createElement('article');const title=document.createElement('h2');title.textContent=name+' '+mode;const c=document.createElement('canvas');c.width=420;c.height=340;a.append(title,c);document.getElementById('grid').append(a);const ctx=c.getContext('2d');ctx.translate(180,280);if(mode==='source'){const k=200/sourceBodyHeight;ctx.scale(k,k);ctx.drawImage(image,-sourceRoot,-bottom)}else{const body=originalLayerData[id]?.parts.find(p=>p.part==='body'),radius=characterManifest[id].referenceRuntimeRadius,collision=characterManifest[id].collisionRadiusPx,k=200/((body?.target[3]??((originalFrameData[id].frames.neutral.size[1]-25)*collision/originalFrameData[id].referenceRadius))*radius/collision);ctx.scale(k,k);const actor={artId:id,x:0,y:0,radius,pose:'neutral',facing:'right',aimAngle:0,poseTime:0,poseProgress:0,alpha:1},frame={time:0,quality:'full'},root=getCharacterAnchors(actor,frame).root;ctx.translate(-root.x,-root.y);drawCharacter(ctx,actor,frame,assets)}}}
</script>
