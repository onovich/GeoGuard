<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>已接入原图身份 原像素生产模块动态验收</title><style>*{box-sizing:border-box}body{margin:20px;background:#fff9ef;color:#4b281c;font:14px sans-serif}main{display:grid;grid-template-columns:repeat(4,210px);gap:12px}article{border:1px solid #ccc;padding:4px}article>b{display:block;min-height:40px}canvas{display:block}p{max-width:900px}button{padding:8px;margin-bottom:12px}#status{display:block;overflow-wrap:anywhere}</style><h1>已接入原图身份 实际生产模块预览</h1><p>上画布采用当前相机基线1.25；下画布3倍放大。调用真实 loadCharacterArt/drawCharacter/getCharacterAnchors，无Pillow预合成。紫框为真实PNG alpha可见bounds，蓝色十字为脚部root，红点为美术M（原锚点接口），并非逻辑弹体出生验证。辅助层仅验收使用，不进入玩家画面。动作循环包括当前真实poseTime/progress；没有逻辑位移。</p><button id="freeze">冻结动画</button><span id="status">载入...</span><main id="grid"></main><script type="module">
import {loadCharacterArt,drawCharacter,getCharacterAnchors} from '/src/view/art/characters/index.js';
const {assets,errors}=await loadCharacterArt({baseUrl:'/'});document.getElementById('status').textContent=`原图载入 ${Object.keys(assets.originalBodies).join(',')}；错误${errors.length}`;
let frozen=false;document.getElementById('freeze').onclick=()=>frozen=!frozen;let time=0,last=performance.now();const cells=[];
for(const [artId,radius] of (new URLSearchParams(location.search).get('id')?[['enemy:'+new URLSearchParams(location.search).get('id'),({BASIC:10,BEACON:12,FAST:8,TANK:16,SHARD:9,SPLINTER:5,SHIELD:12,MEDIC:11,BOMBER:11,JAMMER:12,PHASE:10,BURROWER:12,SCOUT:8,SIEGE:17})[new URLSearchParams(location.search).get('id')]]]:[['enemy:FAST',8],['enemy:TANK',16],['enemy:SHARD',9],['enemy:SPLINTER',5]]))for(const pose of ['neutral','squash','stretch','contact','move','windup','trigger','recover'])for(const [facing,aimAngle] of [['right',0],['left',Math.PI],['up',-Math.PI/2],['down',Math.PI/2]]){const article=document.createElement('article');article.innerHTML=`<b>${artId} / ${pose} / ${facing}</b>`;const canvases=[];for(const zoom of [1.25,3]){const c=document.createElement('canvas');c.width=200;c.height=170;article.append(c);canvases.push({c,zoom})}document.getElementById('grid').append(article);cells.push({artId,radius,pose,facing,aimAngle,canvases})}
function tick(now){if(!frozen)time+=(now-last)/1000;last=now;for(const cell of cells){const actor={artId:cell.artId,x:0,y:0,radius:cell.radius,pose:cell.pose,facing:cell.facing,aimAngle:cell.aimAngle,poseTime:time,poseProgress:(time%1.2)/1.2,alpha:1,hitFlash:0};const frame={time,quality:'full'};for(const {c,zoom}of cell.canvases){const ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);ctx.save();ctx.translate(100,90);ctx.scale(zoom,zoom);const result=drawCharacter(ctx,actor,frame,assets);const a=getCharacterAnchors(actor,frame);if(a){if(a.bounds){ctx.strokeStyle='#9b63ba';ctx.lineWidth=.5/zoom;ctx.strokeRect(a.bounds.x,a.bounds.y,a.bounds.width,a.bounds.height)}ctx.lineWidth=1/zoom;ctx.strokeStyle='#2683d3';ctx.beginPath();ctx.moveTo(a.root.x-4,a.root.y);ctx.lineTo(a.root.x+4,a.root.y);ctx.moveTo(a.root.x,a.root.y-4);ctx.lineTo(a.root.x,a.root.y+4);ctx.stroke();for(const m of a.muzzles??[]){ctx.fillStyle='#d32e35';ctx.beginPath();ctx.arc(m.x,m.y,1.5/zoom,0,Math.PI*2);ctx.fill()}}ctx.restore();if(!result.drawn)ctx.fillText(result.reason,5,25)}}requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script></html>
