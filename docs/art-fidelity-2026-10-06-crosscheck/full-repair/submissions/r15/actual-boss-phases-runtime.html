<!doctype html><meta charset="utf-8"><style>body{background:#fff9ef;color:#4b281c;font:14px system-ui}button,select{font:inherit;padding:8px}img{display:block;max-width:100%}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style><h1>真实Boss AI阶段来源</h1><p>声明构造观察场：真实Boss模板/AI/timer/cast与来源renderer，观察场高玩家/塔HP同既有95场；不手动设置actionMode/open/pose。实际恢复弱点倍率>1时采用正式OPEN身体源。不能把未产生的attack阶段强补为成功。</p><select id="boss"></select><button id="run">生成实际AI阶段</button><pre id="status">实际模块加载</pre><div id="samples"></div><script type="module">
import{loadEngine,createScene}from'/docs/art-fidelity-2026-10-06-crosscheck/runtime-tools/scene-kit-current.mjs';import*as cm from'/src/view/art/characters/index.js';import*as wm from'/src/view/art/world/index.js';import{createPresentationRuntime}from'/src/view/art/integration/presentationRuntime.js';import{drawStickerScene}from'/src/view/art/integration/stickerScene.js';
const engine=await loadEngine(p=>import('/src/'+p)),ca=await cm.loadCharacterArt({baseUrl:'/'}),wa=await wm.loadWorldArt({baseUrl:'/'}),status=document.querySelector('#status'),out=document.querySelector('#samples');for(const id of Object.keys(engine.config.BOSS_TYPES).filter(id=>!/_T[12]$/.test(id))){const o=document.createElement('option');o.value=id;o.textContent=id;document.querySelector('#boss').append(o)}status.textContent=JSON.stringify({characters:ca.status,world:wa.status});
document.querySelector('#run').onclick=()=>{const bossId=document.querySelector('#boss').value,runtime=createPresentationRuntime(),scene=createScene(engine,{kind:'boss',bossId,phaseSeconds:10000,offense:false,presentation:runtime,visualParticles:true}),state=scene.state,records=[],seen=new Set();out.replaceChildren();
const capture=label=>{const boss=scene.bosses[0];state.camera.x=boss.x;state.camera.y=boss.y;const source=[],registry={status:'ready',characters:{status:ca.status,module:cm,assets:{...ca.assets,onSourceDraw:r=>source.push(r)}},world:{status:wa.status,module:wm,assets:{...wa.assets,onSourceDraw:r=>source.push(r)}},drawErrors:[],fallbackArtIds:new Set()},canvas=document.createElement('canvas');canvas.width=1280;canvas.height=720;drawStickerScene(canvas.getContext('2d'),canvas,{state,art:{registry,runtime},getTowerById:id=>state.towerCatalog.find(t=>t.id===id),paused:true});const actors=runtime.inspect().actors.filter(a=>a.domain==='boss'),receipt={label,time:state.gameTime,bosses:scene.bosses.map(b=>({uid:b.uid,id:b.id,hp:b.hp,actionMode:b.bossState.actionMode,actionTimer:b.bossState.actionTimer,castAbility:b.bossState.castAbility,damageTakenMultiplier:b.damageTakenMultiplier})),actors:actors.map(a=>{const g=cm.getCharacterAnchors(a,{time:state.gameTime});return{...a,localRoot:g?[g.root.x-a.x,g.root.y-a.y]:null}}),casts:scene.casts,sourceKeys:[...new Set(source.map(s=>s.key))],source,drawErrors:registry.drawErrors};records.push(receipt);const sec=document.createElement('section'),h=document.createElement('h2'),img=document.createElement('img'),pre=document.createElement('pre'),d=document.createElement('details');h.textContent=label+' @'+state.gameTime.toFixed(3);img.src=canvas.toDataURL();pre.textContent=JSON.stringify(receipt,null,2);d.innerHTML='<summary>真实AI/来源/root收据</summary>';d.append(pre);sec.append(h,img,d);out.append(sec)};capture('actual initial / neutral');
for(let i=0;i<3600;i++){scene.step(1/60);for(const b of scene.bosses){const mode=b.bossState.actionMode,key=b.uid+'/'+mode+'/'+(b.damageTakenMultiplier>1?'open':'closed');if(['windup','attack','recover'].includes(mode)&&!seen.has(key)){seen.add(key);capture('actual '+b.id+' '+mode+(b.damageTakenMultiplier>1?' / vulnerable OPEN':' / no vulnerable OPEN'));}}if(scene.bosses.every(b=>['windup','attack','recover'].every(m=>[...seen].some(s=>s.startsWith(b.uid+'/'+m+'/')))))break}
status.textContent=JSON.stringify({scope:'true AI lifecycle constructed observer, no action/pose/timer setters',bossId,observed:[...seen],samples:records.map(r=>({label:r.label,time:r.time,sourceKeys:r.sourceKeys,drawErrors:r.drawErrors})),unobserved:scene.bosses.map(b=>({id:b.id,modes:['windup','attack','recover'].filter(m=>![...seen].some(s=>s.startsWith(b.uid+'/'+m+'/')))}))},null,2)};
</script>
