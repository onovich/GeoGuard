<h1>来源纹理连续瞄准 · 极限残角与动作</h1><p>实际生产人物模块与原PNG，源头/炮管刚性，软体像素映射，脚根固定。只有黄色/蓝色十字属于QA。声明动作适配，不等于正常游戏或真正首弹；真实出生与命中请另用 r12/shot-runtime.html。此页在同一源尺度检查边界、接缝、非卡点角度和跨方向切换，不单帧fit。</p>
<select id="identity"><option>SNIPER</option><option>RAIL</option></select><button id="generate">生成极限/非卡点全部联系页</button><p id="loading">加载实际人物源…</p><details><summary>完整真实源/矩阵/根点收据</summary><pre id="receipt"></pre></details><main></main>
<script type="module">

const ca=await cm.loadCharacterArt({baseUrl:'/'});document.querySelector('#loading').textContent=ca.status+' / '+ca.errors.join(';');const norm=a=>Math.atan2(Math.sin(a),Math.cos(a));
document.querySelector('#generate').onclick=()=>{const id=document.querySelector('#identity').value,data=originalFrameData['tower:'+id],axes=Object.entries(data.frames).filter(([name,f])=>name.startsWith('neutral-')&&f.sourceAxis!=null).map(([name,f])=>({name,axis:f.sourceAxis})).sort((a,b)=>a.axis-b.axis),angles=[];for(let i=0;i<axes.length;i++){const a=axes[i],b=axes[(i+1)%axes.length];const gap=((b.axis-a.axis)+Math.PI*2)%(Math.PI*2),mid=norm(a.axis+gap/2);angles.push({label:a.name+' exact source axis',angle:a.axis},{label:'boundary before '+a.name,angle:norm(mid-.0001)},{label:'boundary after '+a.name,angle:norm(mid+.0001)})}for(const angle of [.346,1.12,-2.82])angles.push({label:'non-cardinal '+(angle*180/Math.PI).toFixed(2)+'°',angle});const root=document.querySelector('main');root.replaceChildren();const records=[];let referenceRoot;for(const sample of angles)for(const pose of ['neutral','squash','stretch']){const state=createRuntimeState(),tower=createPlacedTower({tower:buildTowerAtLevel(state.towerCatalog.find(t=>t.id===id),0),uid:1,x:0,y:0});state.towers=[tower];const runtime=createPresentationRuntime(),dto=runtime.prepare(state,{width:900,height:500}),production=dto.actors.find(a=>a.actor.artId==='tower:'+id).actor,actor={...production,aimAngle:sample.angle,sourceAimExact:true,pose,poseProgress:pose==='neutral'?0:1,poseTime:0};const frame={time:0,quality:'full'},anchors=cm.getCharacterAnchors(actor,frame),section=document.createElement('section'),title=document.createElement('h2'),canvas=document.createElement('canvas');canvas.width=430;canvas.height=430;referenceRoot??={...anchors.root};title.textContent=sample.label+' / '+pose;section.append(title,canvas);root.append(section);const ctx=canvas.getContext('2d'),receipts=[];ctx.translate(215-referenceRoot.x*1.25,300-referenceRoot.y*1.25);ctx.scale(1.25,1.25);const result=cm.drawCharacter(ctx,actor,frame,{...ca.assets,onSourceDraw:r=>receipts.push(r)});ctx.strokeStyle='#267cba';ctx.lineWidth=.8;ctx.beginPat
