<!doctype html><meta charset="utf-8"><style>body{background:#fff9ef;color:#4b281c;font:14px system-ui}button,select{font:inherit;padding:8px}img{display:block;max-width:100%;height:auto}pre{white-space:pre-wrap;overflow-wrap:anywhere}section{margin:20px 0}</style><h1>合格受术目标 · 真实机制/退款时序</h1><p>构造QA摆场，真实Boss AI cast、独立机制、offense/projectile、结算与来源renderer。Boss phase/高HP来自已声明观察场，不认证正常经济或通关。冰冻场塔远离Boss以保证真实SEAL可存活至触发，仍真实运行offense使冻结计时自然减少；退款场只保留真实基础塔，于courier出生后放到逃跑路径附近，真实子弹击败后观察资金结算。没有直接调用技能、直接kill或改冻结倒计时。</p><select id="case"><option value="freezeTower">freezeTower 实体触发→1.6秒→清理</option><option value="coldSnap">coldSnap 两目标触发→清理</option><option value="refund">stealMoney→Courier真实中弹→refund</option></select><button id="generate">真实推进并生成时序</button><pre id="status">加载实际模块…</pre><div id="samples"></div><script type="module">
import{loadEngine,createScene}from'/docs/art-fidelity-2026-10-06-crosscheck/runtime-tools/scene-kit-current.mjs';import*as cm from'/src/view/art/characters/index.js';import*as wm from'/src/view/art/world/index.js';import{createPresentationRuntime}from'/src/view/art/integration/presentationRuntime.js';import{drawStickerScene}from'/src/view/art/integration/stickerScene.js';
const engine=await loadEngine(p=>import('/src/'+p)),ca=await cm.loadCharacterArt({baseUrl:'/'}),wa=await wm.loadWorldArt({baseUrl:'/'});const status=document.querySelector('#status'),output=document.querySelector('#samples');status.textContent=JSON.stringify({decode:[ca.status,wa.status],scope:'qualified constructed QA, true engine callbacks and timers'});
document.querySelector('#generate').onclick=()=>{const kind=document.querySelector('#case').value,phase=kind==='coldSnap'?2:kind==='freezeTower'?1:0,ability=kind==='refund'?'stealMoney':kind,runtime=createPresentationRuntime({getTowerFireRateFactor:engine.offense.getTowerFireRateFactor}),scene=createScene(engine,{kind:'boss',bossId:kind==='refund'?'COLLECTOR':'FROST_JUDGE',phaseSeconds:10000,offense:true,presentation:runtime,sourceAnchors:cm.getCharacterAnchors}),state=scene.state;state.gameTime=phase*10000;if(kind==='refund')state.towers=[];else state.towers.forEach((t,i)=>{t.x=1800+(i%3)*90;t.y=(Math.floor(i/3)-1)*90});output.replaceChildren();const records=[];let selectedCast=null,courierUid=null,hadFrozen=false,cleared=false,refunded=false,refundTowerPlaced=false,frozenHalf=false;
const capture=label=>{const selected=state.towers.filter(t=>t.frozenTimer>0),courier=state.enemies.find(e=>e.uid===courierUid),focus=selected[0]??courier??(kind==='refund'?state.towers[0]:state.towers[0])??scene.bosses[0];state.camera.x=focus.x;state.camera.y=focus.y;const source=[],registry={status:'ready',characters:{status:ca.status,module:cm,assets:{...ca.assets,onSourceDraw:r=>source.push(r)}},world:{status:wa.status,module:wm,assets:{...wa.assets,onSourceDraw:r=>source.push(r)}},drawErrors:[],fallbackArtIds:new Set()},canvas=document.createElement('canvas');canvas.width=1280;canvas.height=720;drawStickerScene(canvas.getContext('2d'),canvas,{state,art:{registry,runtime},getTowerById:id=>state.towerCatalog.find(t=>t.id===id),paused:true});const record={label,time:state.gameTime,selectedCast,money:state.money,courierUid,towers:state.towers.map(t=>({uid:t.uid,id:t.id,hp:t.hp,x:t.x,y:t.y,frozenTimer:t.frozenTimer??0,actualFireRateFactor:engine.offense.getTowerFireRateFactor(state,t)})),independent:state.enemies.filter(e=>!e.isBoss).map(e=>({uid:e.uid,id:e.id,hp:e.hp,maxHp:e.maxHp,x:e.x,y:e.y,mechanic:e.mechanic})),actualEvents:runtime.inspect().events,statusEvents:scene.statusEvents.filter(e=>e.origin?.castIndex===selectedCast?.index),hits:scene.hits.slice(-12),sourceKeys:[...new Set(source.map(r=>r.key))],source,drawErrors:registry.drawErrors,registryStatus:registry.status};records.push(record);const section=document.createElement('section'),heading=document.createElement('h2'),img=document.createElement('img'),pre=document.createElement('pre'),details=document.createElement('details');heading.textContent=label+' @'+state.gameTime.toFixed(3);img.src=canvas.toDataURL('image/png');details.innerHTML='<summary>完整真实资金/UID/HP/计时/源收据</summary>';pre.textContent=JSON.stringify(record,null,2);details.append(pre);section.append(heading,img,details);output.append(section);return record};capture('qualified initial conditions');
for(let i=0;i<3600;i++){scene.step(1/60);if(!selectedCast){const index=scene.casts.findIndex(c=>c.abilityName===ability);if(index>=0){selectedCast={index,...scene.casts[index]};courierUid=state.enemies.find(e=>e.mechanic?.kind==='courier')?.uid??null;capture('real selected cast / successful independent entity')}}
if(!selectedCast)continue;if(kind==='refund'){if(!refundTowerPlaced&&state.gameTime-selectedCast.time>=1.2){const c=state.enemies.find(e=>e.uid===courierUid);if(c){state.towers=[engine.towers.createPlacedTower({tower:engine.levels.buildTowerAtLevel(state.towerCatalog.find(t=>t.id==='BASIC'),0),uid:state.nextTowerUid++,x:c.x+c.mechanic.escapeVx/95*65,y:c.y+c.mechanic.escapeVy/95*65})];refundTowerPlaced=true;capture('declared normal BASIC ahead of actual courier escape path')}}const event=runtime.inspect().events.find(e=>e.type==='refund'&&e.amount>0);if(event&&!refunded){refunded=true;capture('real courier projectile defeat / +actual refund');for(let n=0;n<36;n++)scene.step(1/60);capture('refund effect lifetime ended');break}}else{const active=state.towers.some(t=>t.frozenTimer>0);if(active&&!hadFrozen){hadFrozen=true;capture('real SEAL trigger / frozen target')}if(hadFrozen&&!frozenHalf&&state.towers.some(t=>t.frozenTimer>0&&t.frozenTimer<=.8)){frozenHalf=true;capture('real frozen timer midpoint / no manual timer edit')}if(hadFrozen&&!active&&!cleared){cleared=true;capture('real frozen timer zero / source effect removed');break}}
}status.textContent=JSON.stringify({scope:'true qualified engine simulation, declared scene setup; not normal-player reachability',kind,selectedCast,courierUid,hadFrozen,cleared,refunded,casts:scene.casts,samples:records.map(r=>({label:r.label,time:r.time,money:r.money,towers:r.towers,independent:r.independent,actualEvents:r.actualEvents,sourceKeys:r.sourceKeys,drawErrors:r.drawErrors}))},null,2)};
</script>
