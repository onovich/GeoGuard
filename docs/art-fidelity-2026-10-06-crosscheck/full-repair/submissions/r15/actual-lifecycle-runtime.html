<!doctype html><meta charset="utf-8"><style>body{background:#fff9ef;color:#4b281c;font:14px system-ui}button,select{font:inherit;padding:8px}img{max-width:100%;display:block}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style><h1>真实行为生命周期</h1><p>声明构造场：正常模板属性、真实行为/攻击/结算，初始清除catalog摆场并指定单敌位置，不修改HP/计时/伤害。phase/burrow场不运行offense，以观察自然状态；death场运行正常英雄与基础塔offense。实际logic移动与root局部注册分别记录，不把固定局部root误说世界不移动。</p><select id="case"><option value="phase">PHASE自然1.4/.65秒相位</option><option value="burrow">BURROWER实际地下→出土</option><option value="death">BASIC实际子弹伤害→死亡→源退场清理</option></select><button id="run">推进真实生命周期</button><pre id="status">实际模块加载中</pre><div id="samples"></div><script type="module">
import{loadEngine,createScene}from'/docs/art-fidelity-2026-10-06-crosscheck/runtime-tools/scene-kit-current.mjs';import*as cm from'/src/view/art/characters/index.js';import*as wm from'/src/view/art/world/index.js';import{createPresentationRuntime}from'/src/view/art/integration/presentationRuntime.js';import{drawStickerScene}from'/src/view/art/integration/stickerScene.js';
const engine=await loadEngine(p=>import('/src/'+p)),ca=await cm.loadCharacterArt({baseUrl:'/'}),wa=await wm.loadWorldArt({baseUrl:'/'});const status=document.querySelector('#status'),out=document.querySelector('#samples');status.textContent=JSON.stringify({characters:ca.status,world:wa.status});
document.querySelector('#run').onclick=()=>{const kind=document.querySelector('#case').value,runtime=createPresentationRuntime({getTowerFireRateFactor:engine.offense.getTowerFireRateFactor}),scene=createScene(engine,{kind:'catalog',offense:kind==='death',visualParticles:true,presentation:runtime,sourceAnchors:cm.getCharacterAnchors}),state=scene.state;state.enemies=[];state.projectiles=[];state.particles=[];state.impactWaves=[];state.drops=[];state.towers=kind==='death'?[engine.towers.createPlacedTower({tower:engine.levels.buildTowerAtLevel(state.towerCatalog.find(t=>t.id==='BASIC'),0),uid:state.nextTowerUid++,x:80,y:60})]:[];const target=engine.spawn.spawnEnemyRuntimeAt({state,enemyKey:kind==='phase'?'PHASE':kind==='burrow'?'BURROWER':'BASIC',x:kind==='death'?120:-160,y:0,extras:{skipBurrowPosition:true}});runtime.reset(state);runtime.captureBirths(state,[target]);out.replaceChildren();const records=[];let lastFlag=Boolean(kind==='phase'?target.phased:target.burrowed),dead=false;
const capture=label=>{state.camera.x=target.x;state.camera.y=target.y;const source=[],registry={status:'ready',characters:{status:ca.status,module:cm,assets:{...ca.assets,onSourceDraw:r=>source.push(r)}},world:{status:wa.status,module:wm,assets:{...wa.assets,onSourceDraw:r=>source.push(r)}},drawErrors:[],fallbackArtIds:new Set()},canvas=document.createElement('canvas');canvas.width=1280;canvas.height=720;drawStickerScene(canvas.getContext('2d'),canvas,{state,art:{registry,runtime},getTowerById:id=>state.towerCatalog.find(t=>t.id===id),paused:true});const probe=runtime.inspect(),actor=probe.actors.find(a=>a.key.endsWith('/'+target.uid)),anchors=actor?cm.getCharacterAnchors(actor,{time:state.gameTime}):null;const receipt={label,time:state.gameTime,uid:target.uid,id:target.id,hp:target.hp,maxHp:target.maxHp,position:[target.x,target.y],inLivingCollection:state.enemies.includes(target),phased:target.phased,phaseTimer:target.phaseTimer,burrowed:target.burrowed,burrowTimer:target.burrowTimer,actor,retiredRoots:probe.retired.map(a=>{const g=cm.getCharacterAnchors(a,{time:state.gameTime});return{key:a.key,alpha:a.alpha,localRoot:g?[g.root.x-a.x,g.root.y-a.y]:null}}),localRoot:anchors?[anchors.root.x-actor.x,anchors.root.y-actor.y]:null,retired:probe.retired,events:probe.events,hits:scene.hits,projectiles:state.projectiles.length,particles:state.particles.length,drops:state.drops.map(d=>({x:d.x,y:d.y,value:d.value})),sourceKeys:[...new Set(source.map(s=>s.key))],source,drawErrors:registry.drawErrors};records.push(receipt);const sec=document.createElement('section'),h=document.createElement('h2'),img=document.createElement('img'),pre=document.createElement('pre'),details=document.createElement('details');h.textContent=label+' @'+state.gameTime.toFixed(3);img.src=canvas.toDataURL();pre.textContent=JSON.stringify(receipt,null,2);details.innerHTML='<summary>完整真实状态与来源收据</summary>';details.append(pre);sec.append(h,img,details);out.append(sec)};capture('actual template initial');
for(let i=0;i<900;i++){scene.step(1/60);if(kind==='death'){if(!dead&&!state.enemies.includes(target)){dead=true;capture('actual projectile defeat and collection removal');for(let n=0;n<7;n++)scene.step(1/60);capture('actual retired source fade midpoint');for(let n=0;n<38;n++)scene.step(1/60);capture('actual retired source cleanup / particles may remain');for(let n=0;n<300&&state.particles.length;n++)scene.step(1/60);capture(state.particles.length===0?'actual particle lifetime exhausted':'particle expiry not covered within observation cap');break}}else{const flag=Boolean(kind==='phase'?target.phased:target.burrowed);if(flag!==lastFlag){capture('actual behavior flag transition');lastFlag=flag;if(kind==='burrow'||records.length>=3){for(let n=0;n<24;n++)scene.step(1/60);capture('real post-transition movement');break}}}}
status.textContent=JSON.stringify({scope:'declared constructed engine lifecycle; no forced phase flags, timers, damage or death',kind,dead,samples:records.map(r=>({label:r.label,time:r.time,uid:r.uid,hp:r.hp,phased:r.phased,burrowed:r.burrowed,localRoot:r.localRoot,sourceKeys:r.sourceKeys,drawErrors:r.drawErrors}))},null,2)};
</script>
