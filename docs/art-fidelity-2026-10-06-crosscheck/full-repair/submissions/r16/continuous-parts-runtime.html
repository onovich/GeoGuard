<!doctype html><meta charset="utf-8"><style>body{background:#fff9ef;color:#4b281c;font:14px system-ui}button,select{font:inherit;padding:8px}main{display:grid;grid-template-columns:repeat(2,460px);gap:12px}canvas{display:block}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style><h1>单源软身＋刚头炮组合试审 · 尚未批准生产</h1><p>真实人物源PNG、实际角色renderer/anchors，声明aim/pose适配，不是首弹证明。脚根固定参考。每角使用同一来源软身/腹斑/双脚和同一刚性头炮PNG。闭合接口尚待 alpha 交叠隔离，不宣称接缝已通过。首弹与非零夹取请使用下方实际offense入口。</p><a href="../r12/shot-runtime.html">真实十源出生/首段入口</a><select id="pose"><option>neutral</option><option>squash</option><option>stretch</option><option>attack</option></select><select id="identity"><option>SNIPER</option><option>RAIL</option></select><button id="stages">合成逐 stage 可见调试</button><button id="lower">全下扇区×4姿态</button><button id="contacts">8角×4姿态实际组合</button><button id="slow">慢扫16秒</button><button id="normal">正常扫4秒</button><button id="stop">停止</button><canvas id="live" width="900" height="440"></canvas><pre id="current"></pre><details><summary>完整实际源收据</summary><pre id="receipt"></pre></details><main></main><script type="module">
import {loadOriginalContinuousCandidates,getContinuousCandidateCompositeDiagnostics} from '/src/view/art/characters/originalPixels.js';import*as cm from'/src/view/art/characters/index.js';import{originalFrameData}from'/src/view/art/characters/originalFrameData.js';import{createPresentationRuntime}from'/src/view/art/integration/presentationRuntime.js';import{createRuntimeState}from'/src/logic/engine/gameState.js';import{createPlacedTower}from'/src/logic/engine/debugTowerRuntime.js';import{buildTowerAtLevel}from'/src/logic/engine/towerRules.js';
const ca=await cm.loadCharacterArt({baseUrl:'/'}),candidateLoad=await loadOriginalContinuousCandidates('/'),norm=a=>Math.atan2(Math.sin(a),Math.cos(a));let animation=0,referenceRoot;function render(canvas,angle,poseOverride){const id=document.querySelector('#identity').value,state=createRuntimeState(),tower=createPlacedTower({tower:buildTowerAtLevel(state.towerCatalog.find(t=>t.id===id),0),uid:1,x:0,y:0});state.towers=[tower];const runtime=createPresentationRuntime(),base=runtime.prepare(state,{width:900,height:500}).actors.find(a=>a.actor.artId==='tower:'+id).actor,actor={...base,aimAngle:angle,sourceAimExact:true,sourceCandidateContinuousParts:true,pose:poseOverride??document.querySelector('#pose').value,poseTime:0},frame={time:0},anchors=cm.getCharacterAnchors(actor,frame),source=[];referenceRoot??={...anchors.root};const ctx=canvas.getContext('2d');ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,canvas.width,canvas.height);ctx.translate(canvas.width/2-referenceRoot.x*1.25,canvas.height*.72-referenceRoot.y*1.25);ctx.scale(1.25,1.25);const drawn=cm.drawCharacter(ctx,actor,frame,{...ca.assets,onSourceDraw:r=>source.push(r)});return{id,angle,drawn,root:anchors.root,referenceRoot,rootDrift:{x:anchors.root.x-referenceRoot.x,y:anchors.root.y-referenceRoot.y},muzzles:anchors.muzzles,bounds:anchors.bounds,source}}
document.querySelector('#contacts').onclick=()=>{cancelAnimationFrame(animation);referenceRoot=null;const records=[],main=document.querySelector('main');main.replaceChildren();for(const pose of ['neutral','squash','stretch','attack'])for(let i=0;i<8;i++){const sec=document.createElement('section'),h=document.createElement('h2'),c=document.createElement('canvas');c.width=460;c.height=320;h.textContent=pose+' '+i*45+'deg';sec.append(h,c);main.append(sec);records.push(render(c,i*Math.PI/4,pose));}document.querySelector('#receipt').textContent=JSON.stringify({scope:'explicit candidate source layers through actual character renderer; production disabled',candidateLoad,samples:records},null,2)};

document.querySelector('#stages').onclick=()=>{cancelAnimationFrame(animation);render(document.querySelector('#live'),Math.PI/4);const stage=getContinuousCandidateCompositeDiagnostics(),main=document.querySelector('main');main.replaceChildren();for(const r of stage){const section=document.createElement('section'),h=document.createElement('h2'),img=document.createElement('img');h.textContent=r.label+' / alpha '+r.alphaPixels;img.src=r.dataUrl;img.width=460;section.append(h,img);main.append(section)}document.querySelector('#receipt').textContent=JSON.stringify(stage.map(({dataUrl,...r})=>r),null,2)};
document.querySelector('#lower').onclick=()=>{cancelAnimationFrame(animation);referenceRoot=null;const records=[],main=document.querySelector('main');main.replaceChildren();for(const pose of ['neutral','squash','stretch','attack'])for(const deg of [64.17,90,95,100,108,112.5,115,125,135,157.5,180]){const sec=document.createElement('section'),h=document.createElement('h2'),c=document.createElement('canvas');c.width=460;c.height=320;h.textContent=pose+' '+deg+'deg';sec.append(h,c);main.append(sec);records.push(render(c,deg*Math.PI/180,pose));}document.querySelector('#receipt').textContent=JSON.stringify({scope:'lower sector original-layer candidate diagnostic',candidateLoad,samples:records},null,2)};
function sweep(seconds){cancelAnimationFrame(animation);referenceRoot=null;const start=performance.now(),live=document.querySelector('#live');const tick=now=>{const elapsed=(now-start)/1000,angle=norm(-Math.PI+elapsed/seconds*2*Math.PI),r=render(live,angle);document.querySelector('#current').textContent=JSON.stringify({declaredAimSweep:true,secondsPerTurn:seconds,elapsed,angle,rootDrift:r.rootDrift,sourceKeys:r.source.map(s=>s.key)},null,2);animation=requestAnimationFrame(tick)};animation=requestAnimationFrame(tick)}document.querySelector('#slow').onclick=()=>sweep(16);document.querySelector('#normal').onclick=()=>sweep(4);document.querySelector('#stop').onclick=()=>cancelAnimationFrame(animation);document.querySelector('#pose').onchange=()=>render(document.querySelector('#live'),0);document.querySelector('#identity').onchange=()=>{cancelAnimationFrame(animation);referenceRoot=null;render(document.querySelector('#live'),0)};render(document.querySelector('#live'),0);
</script>
