<!doctype html><meta charset="utf-8"><style>body{background:#fff9ef;color:#4b281c;font:14px system-ui}button{padding:8px;font:inherit}canvas{display:block;width:960px;height:600px;outline:1px solid #bda78f;margin:12px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style><h1>显式DPR2 backing-store模拟 / 原画失效诊断</h1><p>真实浏览器DPR不修改。两幅960×600 CSS画布，分别960×600和1920×1200 backing-store，用真实drawStickerScene显式presentationDpr=1/2和ctx scale。这是渲染适配器模拟，不能认证真实DPR2整游戏或ReactUI。</p><button data-mode="ready">完整source</button><button data-mode="partial">registry partial</button><button data-mode="failed">registry failed</button><button data-mode="missing">单体BASIC source缺失</button><button data-mode="world:shield">单缺盾</button><button data-mode="world:web-terrain">单缺WEB</button><button data-mode="ui:keycap">单缺键帽</button><button data-mode="tower:BASIC|bullet">单缺弹体</button><button data-mode="formal-sniper">正式SNIPER刚头缺失</button><button data-mode="formal-rail">正式RAIL软身缺失</button><h2>DPR1适配器</h2><canvas id="one" width="960" height="600"></canvas><h2>DPR2模拟</h2><canvas id="two" width="1920" height="1200"></canvas><pre id="status"></pre><script type="module">
import*as cm from'/src/view/art/characters/index.js';import*as wm from'/src/view/art/world/index.js';import{createRuntimeState}from'/src/logic/engine/gameState.js';import{createPlacedTower}from'/src/logic/engine/debugTowerRuntime.js';import{buildTowerAtLevel}from'/src/logic/engine/towerRules.js';import{createPresentationRuntime}from'/src/view/art/integration/presentationRuntime.js';import{drawStickerScene}from'/src/view/art/integration/stickerScene.js';import{getWorldView,screenToWorld,worldToScreen}from'/src/view/art/integration/worldCamera.js';
const status=document.querySelector('#status');const ca=await cm.loadCharacterArt({baseUrl:'/'}),wa=await wm.loadWorldArt({baseUrl:'/'}),base={status:'ready',characters:{status:ca.status,module:cm,assets:ca.assets},world:{status:wa.status,module:wm,assets:wa.assets},drawErrors:[],fallbackArtIds:new Set()},state=createRuntimeState();state.camera={x:67,y:-39,shakeTimer:0};state.player.x=67;state.player.y=-39;state.player.hp=11;state.player.maxHp=100;state.towers=state.towerCatalog.map((t,i)=>createPlacedTower({tower:buildTowerAtLevel(t,i%5),uid:i+1,x:67-320+(i%5)*130,y:-39+40+Math.floor(i/5)*110}));for(const t of state.towers)t.hp=t.maxHp*.11;let mode='ready',input=null;
function draw(){const outputs=[];for(const[canvas,dpr]of[[document.querySelector('#one'),1],[document.querySelector('#two'),2]]){const registry={...base,drawErrors:[],fallbackArtIds:new Set(),characters:{...base.characters,assets:{...base.characters.assets,originalBodies:{...base.characters.assets.originalBodies}}}};registry.world={...base.world,assets:{...base.world.assets,originalEffects:{...base.world.assets.originalEffects}}};if(mode==='formal-sniper'||mode==='formal-rail'){const id=mode==='formal-sniper'?'tower:SNIPER':'tower:RAIL';const key=mode==='formal-sniper'?'candidate-head-neutral':'candidate-body-neutral';registry.characters.assets.originalBodies[id]={...registry.characters.assets.originalBodies[id]};delete registry.characters.assets.originalBodies[id][key];}else if(mode.includes(':'))delete registry.world.assets.originalEffects[mode];else if(mode==='missing')delete registry.characters.assets.originalBodies['tower:BASIC'];else registry.status=mode;const runtime=createPresentationRuntime(),ctx=canvas.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);drawStickerScene(ctx,canvas,{state,art:{registry,runtime},getTowerById:id=>state.towerCatalog.find(t=>t.id===id),paused:true,presentationDpr:dpr});outputs.push({backing:[canvas.width,canvas.height],css:[960,600],explicitDpr:dpr,mode,errors:registry.drawErrors,fatalSourceMissing:registry.fatalSourceMissing??false,sourceLoaded:ca.status})}status.textContent=JSON.stringify({realBrowserDpr:window.devicePixelRatio,scope:'DPR2 adapter simulation, not true browser DPR2',outputs,input},null,2)}
for(const c of document.querySelectorAll('canvas'))c.onclick=event=>{const r=c.getBoundingClientRect(),css={x:(event.clientX-r.left)*960/r.width,y:(event.clientY-r.top)*600/r.height},view=getWorldView(state,960,600),world=screenToWorld(css,view),roundtrip=worldToScreen(world,view);input={canvas:c.id,css,world,roundtrip,error:Math.hypot(css.x-roundtrip.x,css.y-roundtrip.y)};draw()};for(const b of document.querySelectorAll('button'))b.onclick=()=>{mode=b.dataset.mode;draw()};draw();
</script>
