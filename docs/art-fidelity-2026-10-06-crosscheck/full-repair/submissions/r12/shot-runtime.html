<!doctype html><meta charset="utf-8"><style>body{background:#fff9ef;color:#4b281c;font:14px system-ui}button,select{font:inherit;padding:8px;margin:4px}canvas{display:block}pre{white-space:pre-wrap;overflow-wrap:anywhere}section{display:inline-block;vertical-align:top;margin:8px}</style><h1>十发射源 · 真引擎出生/近敌/移动反向射击</h1><p>生产人物、世界、offense及collision模块。测试摆场而非正常关卡。绿色十字=原稿M，红点=真实实体出生。近敌夹取会把真实出生与闪光前移到hurtbox之前；速度/伤害/数量/碰撞不变。方向枪管与真实路径仍待审。</p><select id="identity"></select><select id="direction"><option value="0">右</option><option value="3.141592653589793">左</option><option value="-1.5707963267948966">上</option><option value="1.5707963267948966">下</option><option value="0.7853981633974483">右下45°</option><option value="-0.7853981633974483">右上45°</option><option value="2.356194490192345">左下45°</option><option value="-2.356194490192345">左上45°</option><option value="0.346">自由19.82°</option><option value="1.12">自由64.17°</option><option value="-2.82">自由-161.57°</option></select><select id="distance"><option value="110">远110</option><option value="30">跨越近敌30</option><option value="10">中心重叠10</option><option value="60">炮管附近60</option></select><label><input type="checkbox" id="moving">PLAYER右移（可对左/上射击）</label><button id="reset">重建/出生帧</button><button id="step">真实一帧</button><button id="play">播放/暂停</button><button id="sample">重建并取0/1/3/6帧</button><canvas id="live" width="900" height="500"></canvas><pre id="stats"></pre><div id="samples"></div><script type="module">
import*as cm from'/src/view/art/characters/index.js';import*as wm from'/src/view/art/world/index.js';import{drawStickerScene}from'/src/view/art/integration/stickerScene.js';import{createPresentationRuntime}from'/src/view/art/integration/presentationRuntime.js';import{createRuntimeState}from'/src/logic/engine/gameState.js';import{buildTowerAtLevel}from'/src/logic/engine/towerRules.js';import{createPlacedTower}from'/src/logic/engine/debugTowerRuntime.js';import{updateTowerOffenseRuntime,updatePlayerOffenseRuntime}from'/src/logic/engine/combatOffenseRuntime.js';import{updateProjectileRuntime}from'/src/logic/engine/combatFrameRuntime.js';
const ca=await cm.loadCharacterArt({baseUrl:'/'}),wa=await wm.loadWorldArt({baseUrl:'/'}),registry={status:'ready',characters:{status:ca.status,module:cm,assets:ca.assets},world:{status:wa.status,module:wm,assets:wa.assets},drawErrors:[],fallbackArtIds:new Set()},sel=document.querySelector('#identity');for(const id of ['PLAYER',...createRuntimeState().towerCatalog.map(t=>t.id)])sel.add(new Option(id,id));const direction=document.querySelector('#direction'),distance=document.querySelector('#distance'),moving=document.querySelector('#moving'),stats=document.querySelector('#stats'),samples=document.querySelector('#samples');let state,runtime,births=[],hits=[],ticks=0,playing=false;
const noop=()=>{};
function reset(){playing=false;state=createRuntimeState();state.camera={x:0,y:0,shakeTimer:0};state.player.x=sel.value==='PLAYER'?0:-260;state.player.y=0;state.player.lastShoot=state.player.shootCd;const angle=+direction.value,d=+distance.value;state.enemies=[{uid:91,id:'BASIC',type:'BASIC',x:Math.cos(angle)*d,y:Math.sin(angle)*d,radius:10,hp:12,maxHp:12,color:'#9BCBA8',hitFlash:0,slowTimer:0,slowRatio:1}];if(sel.value!=='PLAYER'){let t=state.towerCatalog.find(t=>t.id===sel.value);t=createPlacedTower({tower:buildTowerAtLevel(t,0),uid:41,x:0,y:0});t.lastShoot=t.fireRate;state.towers=[t]}runtime=createPresentationRuntime();runtime.prepare(state,{width:900,height:500});if(moving.checked&&sel.value==='PLAYER'){state.gameTime=1/60;state.player.x+=1}const resolveProjectileOrigin=request=>runtime.resolveProjectileOrigin(state,request,cm.getCharacterAnchors);if(sel.value==='PLAYER')updatePlayerOffenseRuntime({state,dt:0,resolveProjectileOrigin});else updateTowerOffenseRuntime({state,dt:0,spawnParticle:noop,resolveProjectileOrigin});runtime.captureShots(state,0);births=state.projectiles.map(p=>({x:p.x,y:p.y,vx:p.vx,vy:p.vy,radius:p.radius,damage:p.damage,shotIndex:p.shotIndex,sourceBoreDeviationDegrees:Number.isFinite(p.birthOrigin?.sourceBoreAxisAngle)?Math.atan2(Math.sin(p.birthOrigin.sourceBoreAxisAngle-Math.atan2(p.vy,p.vx)),Math.cos(p.birthOrigin.sourceBoreAxisAngle-Math.atan2(p.vy,p.vx)))*180/Math.PI:null,origin:p.birthOrigin}));hits=[];ticks=0;draw()}
function step(){state.gameTime+=1/60;ticks++;if(moving.checked&&sel.value==='PLAYER')state.player.x+=1;updateProjectileRuntime({state,dt:1/60,damageEnemy:(enemy,damage,p)=>{hits.push({frame:ticks,time:state.gameTime,enemy:{x:enemy.x,y:enemy.y,radius:enemy.radius},bullet:{x:p.x,y:p.y,previousX:p.previousX,previousY:p.previousY,radius:p.radius},centreDistance:Math.hypot(p.x-enemy.x,p.y-enemy.y),damage});enemy.hp-=damage;runtime.captureHit(state,enemy,p)},spawnFloatingText:noop,spawnParticle:noop,spawnImpactWave:noop});draw()}
function draw(canvas=document.querySelector('#live')){const ctx=canvas.getContext('2d');drawStickerScene(ctx,canvas,{state,art:{registry,runtime},getTowerById:()=>null,paused:true});ctx.save();ctx.translate(canvas.width/2,canvas.height/2);ctx.scale(1.25,1.25);for(const b of births){const m=b.origin?.requested;if(m){ctx.strokeStyle='#16884b';ctx.beginPath();ctx.moveTo(m.x-4,m.y);ctx.lineTo(m.x+4,m.y);ctx.moveTo(m.x,m.y-4);ctx.lineTo(m.x,m.y+4);ctx.stroke()}ctx.fillStyle='#da3c32';ctx.fillRect(b.x-2,b.y-2,4,4)}ctx.restore();stats.textContent=JSON.stringify({ticks,source:sel.value,births,hits,currentBulletCentres:state.projectiles.map(p=>({x:p.x,y:p.y})),actors:runtime.inspect().actors.map(a=>({artId:a.artId,pose:a.pose,facing:a.facing,aimAngle:a.aimAngle})),decode:[ca.status,wa.status],errors:registry.drawErrors},null,2)}
document.querySelector('#reset').onclick=reset;document.querySelector('#step').onclick=step;document.querySelector('#play').onclick=()=>playing=!playing;document.querySelector('#sample').onclick=()=>{reset();samples.innerHTML='';for(let f=0;f<=6;f++){if(f)step();if([0,1,3,6].includes(f)){let section=document.createElement('section');section.innerHTML='<h2>真实帧 '+f+'</h2><canvas width="900" height="500"></canvas>';samples.append(section);draw(section.querySelector('canvas'))}}};for(const input of [sel,direction,distance,moving])input.onchange=reset;setInterval(()=>{if(playing&&ticks<90)step();else if(ticks>=90)playing=false},1000/60);reset();
</script>
