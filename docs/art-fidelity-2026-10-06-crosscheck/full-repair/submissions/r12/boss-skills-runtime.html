<!doctype html><meta charset="utf-8"><style>body{background:#fff9ef;color:#4b281c;font:14px system-ui}button,select{font:inherit;padding:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere}canvas{display:block}</style><h1>Boss 真引擎技能/独立实体 · 构造测试摆场</h1><p>调用真实Boss、enemy behavior、hazards、机制、presentation及source renderer。玩家/塔高HP用于长时观察，phase按时间强制，不声称正常玩家经济/通关。不会直接调用某技能伪造cast；正常技能选取由真实Boss combat推进。</p><select id="boss"></select><select id="phase"><option value="0">phase0</option><option value="1">phase1</option><option value="2">phase2</option></select><label><input type="checkbox" id="offense">我方真实射击</label><button id="reset">重建</button><button id="step">一帧</button><button id="play">播放/暂停</button><button id="advance">推进10秒</button><select id="survivor-role"><option value="sun">保留Sun</option><option value="moon">保留Moon</option></select><button id="survivor">双子一方倒下</button><select id="skill"></select><button id="seek">真实推进到所选cast</button><button id="download">导出当前观测JSON</button><h2>真实1.25 source近景</h2><canvas id="main" width="1280" height="720"></canvas><h2>真实全局位置/危区概览（缩放适配器，非像素美观认证）</h2><canvas id="overview" width="1280" height="720"></canvas><pre id="status"></pre><script type="module">
import{loadEngine,createScene}from'/docs/art-fidelity-2026-10-06-crosscheck/runtime-tools/scene-kit-current.mjs';import*as cm from'/src/view/art/characters/index.js';import*as wm from'/src/view/art/world/index.js';import{createPresentationRuntime}from'/src/view/art/integration/presentationRuntime.js';import{drawStickerScene}from'/src/view/art/integration/stickerScene.js';
const engine=await loadEngine(path=>import('/src/'+path)),ca=await cm.loadCharacterArt({baseUrl:'/'}),wa=await wm.loadWorldArt({baseUrl:'/'}),registry={status:'ready',characters:{status:ca.status,module:cm,assets:ca.assets},world:{status:wa.status,module:wm,assets:wa.assets},drawErrors:[],fallbackArtIds:new Set()},boss=document.querySelector('#boss'),phase=document.querySelector('#phase'),offense=document.querySelector('#offense'),status=document.querySelector('#status'),canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');for(const id of engine.config.BOSS_ORDER)boss.add(new Option(id,id));const skill=document.querySelector('#skill'),coverage=await fetch('./skill-runtime-observations.json').then(r=>r.json());for(const s of coverage.skills)skill.add(new Option(s.key.replace('skill:',''),s.key.replace('skill:','')));let scene,runtime,playing=false,observations=[],knownEntities=new Set(),knownHazards=new Set(),survivor=false;
function reset(){playing=false;survivor=false;runtime=createPresentationRuntime({getTowerFireRateFactor:engine.offense.getTowerFireRateFactor});scene=createScene(engine,{kind:'boss',bossId:boss.value,phaseSeconds:1000,offense:offense.checked,presentation:runtime,sourceAnchors:cm.getCharacterAnchors});scene.state.camera={x:0,y:0,shakeTimer:0};scene.state.gameTime=+phase.value*1000;scene.state.floatingTexts=[];observations=[];knownEntities=new Set(scene.state.enemies);knownHazards=new Set();draw()}
function observe(){const s=scene.state;for(const e of s.enemies)if(!knownEntities.has(e)){knownEntities.add(e);observations.push({type:'independent-birth',time:s.gameTime,uid:e.uid,id:e.id,mechanic:e.mechanic?.kind??null,hp:e.hp,maxHp:e.maxHp,owner:e.summonedByBossUid,initialPosition:[e.x,e.y],initialTimer:e.mechanic?.timer??null})}for(const h of s.hazards){if(!knownHazards.has(h)){knownHazards.add(h);observations.push({type:'warn-birth',time:s.gameTime,hazardType:h.type,label:h.label,owner:h.ownerBossUid,timer:h.timer,radius:h.radius,width:h.width,from:[h.x,h.y],to:[h.x2,h.y2]})}if(h.timer<=1/60&&!observations.some(o=>o.type==='resolve'&&o.ref===h)){observations.push({type:'resolve',ref:h,time:s.gameTime,label:h.label,timer:h.timer})}}for(const h of knownHazards)if(!s.hazards.includes(h)&&!observations.some(o=>o.type==='hazard-ended'&&o.ref===h))observations.push({type:'hazard-ended',ref:h,time:s.gameTime,label:h.label});}
function step(){if(survivor&&scene.bosses.length>1)scene.bosses.find(b=>b.twinRole!==document.querySelector('#survivor-role').value).hp=0;scene.step(1/60);if(survivor&&scene.bosses.length>1)scene.bosses.find(b=>b.twinRole!==document.querySelector('#survivor-role').value).hp=0;observe();draw()}
function draw(){const s=scene.state,liveBoss=scene.bosses.find(b=>b.hp>0)??s.player;s.camera.x=(liveBoss.x+s.player.x)/2;s.camera.y=(liveBoss.y+s.player.y)/2;drawStickerScene(ctx,canvas,{state:s,art:{registry,runtime},getTowerById:()=>null,paused:!playing});
 const points=[s.player,...s.towers,...s.enemies.filter(e=>e.hp>0)],extents=points.flatMap(e=>[{x:e.x-(e.radius??12)*3,y:e.y-(e.radius??12)*4},{x:e.x+(e.radius??12)*3,y:e.y+(e.radius??12)*3}]);const prepared=runtime.prepare(s,{width:1024,height:576},s.camera,true);for(const{actor}of prepared.actors){const b=cm.getCharacterAnchors(actor,prepared.frame)?.bounds;if(b)extents.push({x:b.x,y:b.y},{x:b.x+b.width,y:b.y+b.height})}for(const wave of s.impactWaves)extents.push({x:wave.x-wave.radius,y:wave.y-wave.radius},{x:wave.x+wave.radius,y:wave.y+wave.radius});for(const h of s.hazards){if(h.type==='area')extents.push({x:h.x-h.radius,y:h.y-h.radius},{x:h.x+h.radius,y:h.y+h.radius});else extents.push({x:h.x-h.width,y:h.y-h.width},{x:h.x2+h.width,y:h.y2+h.width})}const minX=Math.min(...extents.map(p=>p.x)),maxX=Math.max(...extents.map(p=>p.x)),minY=Math.min(...extents.map(p=>p.y)),maxY=Math.max(...extents.map(p=>p.y)),overviewZoom=Math.min(1.25,1200/Math.max(1,maxX-minX),640/Math.max(1,maxY-minY)),saved={...s.camera};s.camera.x=(minX+maxX)/2;s.camera.y=(minY+maxY)/2;drawStickerScene(document.querySelector('#overview').getContext('2d'),document.querySelector('#overview'),{state:s,art:{registry,runtime},getTowerById:()=>null,paused:!playing,presentationZoom:overviewZoom});s.camera=saved;status.textContent=JSON.stringify({scope:scene.provenance,overviewZoom,time:s.gameTime,casts:scene.casts.slice(-30),bossStates:scene.bosses.map(b=>({uid:b.uid,id:b.id,hp:b.hp,phase:b.currentPhaseIndex,cast:b.bossState?.castAbility,action:b.bossState?.actionMode,actionTimer:b.bossState?.actionTimer,partnerFallen:b.bossState?.partnerFallen})),liveIndependent:s.enemies.filter(e=>!e.isBoss).map(e=>({uid:e.uid,id:e.id,hp:e.hp,mechanic:e.mechanic?.kind,life:e.mechanic?.life,aiTimer:e.mechanic?.timer,position:[e.x,e.y],fuseTimer:e.fuseTimer})),hazardLifecycle:scene.hazardLifecycle.slice(-30),hazards:s.hazards.map(h=>({type:h.type,label:h.label,timer:h.timer,radius:h.radius,width:h.width})),observations:observations.slice(-40).map(({ref,...o})=>o),errors:registry.drawErrors,decode:[ca.status,wa.status]},null,2)}
document.querySelector('#seek').onclick=()=>{const record=coverage.skills.find(s=>s.key==='skill:'+skill.value),sample=record?.actualCasts[0];if(!sample)return;const match=sample.caseId.match(/^(.+)-P(\d)-seed/),solo=sample.caseId.match(/^TWINS-survivor-(sun|moon)-P(\d)/);if(!match&&!solo)return;boss.value=solo?'TWINS':match[1];phase.value=solo?solo[2]:match[2];offense.checked=false;reset();if(solo){document.querySelector('#survivor-role').value=solo[1];survivor=true;scene.bosses.find(b=>b.twinRole!==solo[1]).hp=0;}for(let i=0;i<5400;i++){step();if(scene.casts.some(c=>c.abilityName===skill.value))break}};document.querySelector('#reset').onclick=reset;document.querySelector('#step').onclick=step;document.querySelector('#play').onclick=()=>playing=!playing;document.querySelector('#advance').onclick=()=>{for(let i=0;i<600;i++)step()};document.querySelector('#survivor').onclick=()=>{survivor=true;if(scene.bosses.length>1)scene.bosses.find(b=>b.twinRole!==document.querySelector('#survivor-role').value).hp=0;draw()};document.querySelector('#download').onclick=()=>{const data={provenance:scene.provenance,casts:scene.casts,observations:observations.map(({ref,...o})=>o),hits:scene.hits};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='boss-'+boss.value+'-phase'+phase.value+'-observations.json';a.click();URL.revokeObjectURL(a.href)};for(const input of[boss,phase,offense])input.onchange=reset;setInterval(()=>{if(playing)step()},1000/60);reset();
</script>
