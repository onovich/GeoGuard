<!doctype html><meta charset="utf-8"><title>S1 original pixel skin review</title><style>*{box-sizing:border-box}body{margin:0;font:16px sans-serif;color:#4b281c}section{padding:30px;display:flex;gap:24px;flex-wrap:wrap}.cream{background:#fff9ef}.dark{background:#353535}.skin{border:20px solid transparent;border-image-source:var(--asset);border-image-slice:var(--slice) fill;border-image-width:20px;border-image-repeat:stretch;background:transparent}.button{width:210px;min-height:64px;display:grid;place-items:center}.panel{width:420px;height:220px;padding:20px}.card{width:210px;height:260px;padding:20px}.key{width:52px;height:52px;border-width:9px;border-image-width:9px;display:grid;place-items:center}</style><main id="main"></main><script>const root=document.getElementById('main');for(const bg of ['cream','dark']){const section=document.createElement('section');section.className=bg;for(const [id,slice,kind,label] of [['button-sage',29,'button','开始游戏'],['button-coral',29,'button','重新挑战'],['button-blue',26,'button','解锁蓝图'],['button-honey',26,'button','获取物资'],['panel',16,'panel','动态面板正文／原画像素九宫格'],['card',16,'card','动态奖励卡正文'],['keycap',9,'key','W']]){const skin=document.createElement('div');skin.className='skin '+kind;skin.style.setProperty('--asset',`url(/art/original/v1/${id}.png)`);skin.style.setProperty('--slice',slice);skin.textContent=label;section.appendChild(skin)}root.appendChild(section)}</script>
