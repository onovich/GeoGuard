<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">GeoGuard social preview</title>
  <desc id="desc">A geometric survival-defense cover showing the running canvas game, player, enemies, gems, and tower blueprints.</desc>
  <defs>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#d5e0ee" stroke-width="1"/>
    </pattern>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0d1729"/>
      <stop offset="1" stop-color="#14233a"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#1b2b43" flood-opacity="0.22"/>
    </filter>
    <clipPath id="screen"><rect x="430" y="44" width="806" height="552" rx="26"/></clipPath>
  </defs>
  <rect width="1280" height="640" fill="#eef4fa"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <g clip-path="url(#screen)" filter="url(#shadow)">
    <image href="social-preview-source.png" x="430" y="44" width="806" height="552" preserveAspectRatio="xMidYMid slice"/>
  </g>
  <rect x="430" y="44" width="806" height="552" rx="26" fill="none" stroke="#c7d4e4" stroke-width="2"/>
  <path d="M0 0H478L430 640H0Z" fill="url(#panel)"/>
  <g opacity="0.35" fill="none" stroke="#6f87a9">
    <circle cx="236" cy="176" r="132"/>
    <circle cx="236" cy="176" r="94"/>
    <circle cx="236" cy="176" r="54"/>
    <path d="M74 176H397M236 22V330"/>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="48" y="70" fill="#93a8c5" font-size="15" font-weight="800" letter-spacing="3">SURVIVAL / DEFENSE / GEOMETRY</text>
    <text x="46" y="178" fill="#ffffff" font-size="74" font-weight="850" letter-spacing="-3">GEO</text>
    <text x="46" y="250" fill="#6ee7c2" font-size="74" font-weight="850" letter-spacing="-3">GUARD</text>
    <text x="50" y="298" fill="#dce7f5" font-size="21" font-weight="600">Move. Auto-fire. Build the field.</text>
    <text x="50" y="334" fill="#9fb1c8" font-size="17">Collect gems, place towers, survive the wave.</text>
    <g transform="translate(50 392)">
      <rect width="108" height="38" rx="11" fill="#1c3150" stroke="#385376"/>
      <rect x="120" width="108" height="38" rx="11" fill="#1c3150" stroke="#385376"/>
      <rect x="240" width="108" height="38" rx="11" fill="#1c3150" stroke="#385376"/>
      <text x="54" y="25" fill="#a9c9f3" font-size="14" font-weight="800" text-anchor="middle">AUTO-FIRE</text>
      <text x="174" y="25" fill="#a9c9f3" font-size="14" font-weight="800" text-anchor="middle">TOWERS</text>
      <text x="294" y="25" fill="#a9c9f3" font-size="14" font-weight="800" text-anchor="middle">BOSSES</text>
    </g>
    <g transform="translate(76 501)">
      <rect x="0" y="0" width="38" height="38" rx="8" fill="#ef4d3d"/>
      <circle cx="105" cy="19" r="19" fill="#3b82d6"/>
      <path d="M190 19l17-17 17 17-17 17z" fill="#3ed6a5"/>
      <path d="M38 19H86M124 19H188" stroke="#7187a5" stroke-width="3" stroke-dasharray="7 8"/>
    </g>
    <text x="49" y="596" fill="#7187a5" font-size="13" font-weight="700" letter-spacing="2">HTML5 CANVAS · REACT · VITE</text>
  </g>
</svg>
